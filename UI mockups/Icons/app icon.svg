<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Transparent background -->
  <rect width="100%" height="100%" fill="none" />

  <g fill="none" stroke="#162a86" stroke-linecap="round" stroke-linejoin="round">
    <!-- RECEIPT OUTLINE WITH ZIG-ZAG BOTTOM -->
    <path d="
      M 140 100 
      L 340 100 
      L 340 370 
      L 323.3 355 L 306.6 370 L 290 355 L 273.3 370 L 256.6 355 L 240 370 L 223.3 355 L 206.6 370 L 190 355 L 173.3 370 L 156.6 355 L 140 370 
      Z" stroke-width="14" fill="none" />

    <!-- RECEIPT HEADER & TEXT LINES -->
    <!-- Main Title Bar -->
    <line x1="180" y1="135" x2="290" y2="135" stroke-width="12" />
    <line x1="200" y1="155" x2="270" y2="155" stroke-width="10" />

    <!-- Itemized List Lines -->
    <line x1="165" y1="185" x2="295" y2="185" stroke-width="10" />
    
    <!-- Bulleted List Section -->
    <circle cx="170" cy="210" r="3" fill="#162a86" stroke="none" />
    <line x1="185" y1="210" x2="240" y2="210" stroke-width="8" />
    
    <circle cx="170" cy="228" r="3" fill="#162a86" stroke="none" />
    <line x1="185" y1="228" x2="225" y2="228" stroke-width="8" />

    <circle cx="170" cy="246" r="3" fill="#162a86" stroke="none" />
    <line x1="185" y1="246" x2="235" y2="246" stroke-width="8" />

    <!-- Summary / Total Lines -->
    <line x1="165" y1="275" x2="245" y2="275" stroke-width="10" />
    <line x1="285" y1="275" x2="315" y2="275" stroke-width="10" />

    <line x1="285" y1="300" x2="315" y2="300" stroke-width="8" />
    <line x1="280" y1="325" x2="315" y2="325" stroke-width="10" />

    <!-- OVERLAPPING PEN (DIAGONAL) -->
    <!-- White Knockout Mask to create separation behind the pen -->
    <path d="M 235 345 L 340 135 L 375 152 L 270 362 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" />

    <!-- Pen Outer Body & Nib -->
    <!-- Nib -->
    <path d="M 243 328 L 255 334 L 236 348 Z" fill="#162a86" stroke-width="2" />
    <!-- Lower Barrel -->
    <path d="M 255 334 L 315 215 L 338 226 L 278 345 Z" fill="#162a86" stroke-width="4" />
    <!-- Upper Barrel / Cap -->
    <path d="M 320 205 L 360 125 C 368 109, 380 120, 372 135 L 343 216 Z" fill="#162a86" stroke-width="4" />
    <!-- Pen Clip -->
    <path d="M 358 135 L 375 160 L 365 180" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Pen Divider Ring -->
    <line x1="312" y1="220" x2="340" y2="234" stroke="#FFFFFF" stroke-width="6" />
  </g>
</svg>